<!doctype html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#153E5C"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Solico">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>ورود به Solico</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#153e5c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;direction:rtl}.card{width:min(92vw,430px);background:#fff;border:1px solid #dce8ef;border-radius:24px;padding:28px;box-shadow:0 18px 45px #153e5c20}.logo{width:78px;height:78px;border-radius:20px;display:block;margin:0 auto 14px}.title{text-align:center;font-size:25px;font-weight:800;margin:0}.sub{text-align:center;color:#718796;font-size:13px;line-height:1.8;margin:7px 0 22px}label{display:block;font-size:12px;color:#617b8d;margin:10px 2px 6px}input{width:100%;height:52px;border:1px solid #cadbe6;border-radius:14px;padding:0 14px;font-size:16px;outline:none;direction:ltr}input:focus{border-color:#248bd0;box-shadow:0 0 0 3px #248bd019}button{width:100%;height:52px;border:0;border-radius:14px;margin-top:18px;background:#1683d8;color:#fff;font-size:16px;font-weight:800}.status{min-height:24px;margin-top:12px;text-align:center;color:#a43c44;font-size:12px;line-height:1.7}.hint{margin-top:18px;border-top:1px solid #edf2f5;padding-top:14px;font-size:11px;color:#7a8d9c;line-height:1.8;text-align:center}
</style></head><body><main class="card"><img src="app_icon.png" class="logo" alt="Solico"><h1 class="title">ورود به Solico</h1><p class="sub">نسخه وب مخصوص iPhone و iPad</p><label>نام کاربری</label><input id="u" autocomplete="username" placeholder="نام کاربری"><label>رمز عبور</label><input id="p" type="password" autocomplete="current-password" placeholder="رمز عبور"><button id="login">ورود</button><div id="status" class="status"></div><div class="hint">بعد از ورود، برنامه را از Safari با گزینه <b>Add to Home Screen</b> روی صفحه اصلی اضافه کنید.</div></main>
<script>
const USER='admin', PASS_HASH='59fd58aa8844043f7d0ef9d15435f04f4b769d5d82ef089170ffd65e394c5cf0';
function hex(b){return [...b].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function sha(s){return hex(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s))))}
function rid(){if(crypto.randomUUID)return crypto.randomUUID();const a=new Uint8Array(16);crypto.getRandomValues(a);return hex(a)}
async function go(){const b=document.getElementById('login'),s=document.getElementById('status');b.disabled=true;s.textContent='در حال بررسی...';try{const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;if(u.toLowerCase()!==USER||await sha(p)!==PASS_HASH){s.textContent='نام کاربری یا رمز عبور نادرست است.';b.disabled=false;return}localStorage.setItem('solico_web_logged_in','1');localStorage.setItem('solico_web_login_session_id',rid());localStorage.removeItem('solico_web_last_register');localStorage.removeItem('solico_web_registration_receipt_ms');localStorage.setItem('solico_web_status','Build 21 • ورود انجام شد؛ در حال ثبت دستگاه...');location.replace('./?b=21&_='+Date.now())}catch(e){s.textContent='ورود ناموفق بود.';b.disabled=false}}
document.getElementById('login').onclick=go;document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
if(localStorage.getItem('solico_web_logged_in')==='1')location.replace('./?b=21&_='+Date.now());
</script></body></html>
